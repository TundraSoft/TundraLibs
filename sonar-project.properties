# SonarQube Cloud configuration for TundraLibs.
#
# Glob-based (no per-package enumeration needed) — every package lives under
# packages/, so the globs below adapt automatically as packages are added or
# removed. Project/organization keys match the SonarQube Cloud project.

sonar.projectKey=TundraSoft_TundraLibs
sonar.organization=tundrasoft
sonar.projectName=TundraLibs

# Only the package sources are analysed. Root tooling (.github, scripts) and
# generated/backup dirs are out of scope.
sonar.sources=packages
sonar.tests=packages
sonar.sourceEncoding=UTF-8

# Test/bench files are scanned as tests, not product code.
sonar.test.inclusions=**/*.test.ts,**/*.bench.ts,**/tests/**/*.ts
sonar.test.exclusions=**/fixtures/**

# Excluded from analysis entirely (tests, benches, fixtures, coverage output).
# package.json excluded: lockfiles (bun.lock/deno.lock) are intentionally not
# committed in this workspace, and inter-package deps use the deterministic
# `workspace:*` protocol — so the "missing lock file" rule is a false positive.
sonar.exclusions=**/*.test.ts,**/*.bench.ts,**/tests/**,**/fixtures/**,coverage/**,**/package.json

# Never count test/fixture code toward coverage.
sonar.coverage.exclusions=**/*.test.ts,**/*.bench.ts,**/tests/**,**/fixtures/**

# Duplicate-detection ignores test/bench code.
sonar.cpd.exclusions=**/*.test.ts,**/*.bench.ts,**/tests/**,**/fixtures/**

# Coverage report produced by `deno coverage ./coverage --lcov` in CI.
# The javascript key covers TypeScript sources too.
sonar.javascript.lcov.reportPaths=coverage/report.lcov
