# GENERATED by .github/scripts/workspace.ts — do not edit.
# One component per package; a single LCOV upload is split by path.
ignore:
  - '**/*.test.ts'
  - '**/*.bench.ts'
  - '**/tests/**'
  - '**/fixtures/**'
  - '.github/**'
coverage:
  precision: 2
  round: down
  range: '70...90'
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 70%
        threshold: 5%
comment:
  layout: 'reach, diff, components, files, footer'
  behavior: default
  require_changes: false
component_management:
  default_rules:
    statuses:
      - type: project
        target: auto
        threshold: 1%
        branches:
          - '!main'
