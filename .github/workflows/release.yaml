name: 'Release Pipeline'

permissions:
  contents: write
  id-token: write
  pull-requests: read

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force release even if no changes detected'
        required: false
        default: false
        type: boolean
      release_type:
        description: 'Type of release (patch, minor, major)'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  # First job: Check if release is needed
  check-changes:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    outputs:
      has-workspace-changes: ${{ steps.changes.outputs.has-changes }}
      changed-workspaces: ${{ steps.changes.outputs.changed-workspaces }}
      pr-title: ${{ steps.pr-info.outputs.title }}
      pr-number: ${{ steps.pr-info.outputs.number }}
      pr-body: ${{ steps.pr-info.outputs.body }}
      pr-author: ${{ steps.pr-info.outputs.author }}
      pr-url: ${{ steps.pr-info.outputs.url }}

    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR information
        id: pr-info
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "title=${{ github.event.pull_request.title }}" >> $GITHUB_OUTPUT
            echo "number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
            echo "author=${{ github.event.pull_request.user.login }}" >> $GITHUB_OUTPUT
            echo "url=${{ github.event.pull_request.html_url }}" >> $GITHUB_OUTPUT
            echo 'body<<EOF' >> $GITHUB_OUTPUT
            echo '${{ github.event.pull_request.body }}' >> $GITHUB_OUTPUT
            echo 'EOF' >> $GITHUB_OUTPUT
          else
            echo "title=Manual Release" >> $GITHUB_OUTPUT
            echo "number=manual" >> $GITHUB_OUTPUT
            echo "author=${{ github.actor }}" >> $GITHUB_OUTPUT
            echo "url=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_OUTPUT
            echo "body=Manual release triggered via workflow dispatch" >> $GITHUB_OUTPUT
          fi

      - name: Check for workspace changes
        id: changes
        run: |
          echo "Checking for changes in workspace files..."
          
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.force_release }}" = "true" ]; then
            echo "has-changes=true" >> $GITHUB_OUTPUT
            echo "changed-workspaces=all" >> $GITHUB_OUTPUT
            echo "Force release requested"
            exit 0
          fi
          
          # Get the merge commit or last commit
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Get changes from the PR
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            # Get changes from last commit
            BASE_SHA="HEAD~1"
            HEAD_SHA="HEAD"
          fi
          
          echo "Comparing $BASE_SHA..$HEAD_SHA"
          
          # Check for changes in workspace directories, excluding workflow files
          CHANGED_FILES=$(git diff --name-only $BASE_SHA..$HEAD_SHA)
          echo "Changed files:"
          echo "$CHANGED_FILES"
          
          # Get workspace directories from deno.json
          WORKSPACE_DIRS=$(jq -r '.workspace[]' deno.json | sed 's|^./||' | paste -sd '|' -)
          
          # Filter out non-workspace changes
          WORKSPACE_CHANGES=$(echo "$CHANGED_FILES" | grep -E "^($WORKSPACE_DIRS)/" | grep -v '.github/' || true)
          
          if [ -z "$WORKSPACE_CHANGES" ]; then
            echo "No workspace changes detected"
            echo "has-changes=false" >> $GITHUB_OUTPUT
            echo "changed-workspaces=" >> $GITHUB_OUTPUT
          else
            echo "Workspace changes detected:"
            echo "$WORKSPACE_CHANGES"
            echo "has-changes=true" >> $GITHUB_OUTPUT
            
            # Determine which workspaces changed
            CHANGED_WORKSPACES=""
            WORKSPACES=$(jq -r '.workspace[]' deno.json | sed 's|^./||')
            for workspace in $WORKSPACES; do
              if echo "$WORKSPACE_CHANGES" | grep -q "^$workspace/"; then
                CHANGED_WORKSPACES="$CHANGED_WORKSPACES $workspace"
              fi
            done
            
            echo "changed-workspaces=$(echo $CHANGED_WORKSPACES | xargs)" >> $GITHUB_OUTPUT
          fi

  # Second job: Update changelog
  update-changelog:
    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.has-workspace-changes == 'true'
    outputs:
      changelog-updated: ${{ steps.changelog.outputs.updated }}

    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Update CHANGELOG.md
        id: changelog
        run: |
          # Create CHANGELOG.md if it doesn't exist
          if [ ! -f CHANGELOG.md ]; then
            echo "# Changelog" > CHANGELOG.md
            echo "" >> CHANGELOG.md
            echo "All notable changes to this project will be documented in this file." >> CHANGELOG.md
            echo "" >> CHANGELOG.md
            echo "The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/)," >> CHANGELOG.md
            echo "and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html)." >> CHANGELOG.md
            echo "" >> CHANGELOG.md
            git add CHANGELOG.md
            git commit -m "docs: Create initial CHANGELOG.md"
          fi
          
          # Get current date
          CURRENT_DATE=$(date +"%Y-%m-%d")
          
          # Prepare changelog entry
          TEMP_FILE=$(mktemp)
          
          # Parse PR title for conventional commit type
          PR_TITLE="${{ needs.check-changes.outputs.pr-title }}"
          echo "Processing PR: $PR_TITLE"
          
          # Extract type and scope from conventional commit format
          if [[ "$PR_TITLE" =~ ^([a-z]+)(\([^)]+\))?: ]]; then
            COMMIT_TYPE="${BASH_REMATCH[1]}"
            COMMIT_SCOPE="${BASH_REMATCH[2]}"
          else
            COMMIT_TYPE="chore"
            COMMIT_SCOPE=""
          fi
          
          # Determine changelog category
          case "$COMMIT_TYPE" in
            "feat")
              CATEGORY="### Added"
              ;;
            "fix")
              CATEGORY="### Fixed"
              ;;
            "perf")
              CATEGORY="### Performance"
              ;;
            "docs")
              CATEGORY="### Documentation"
              ;;
            "style"|"refactor")
              CATEGORY="### Changed"
              ;;
            "test")
              CATEGORY="### Testing"
              ;;
            "BREAKING")
              CATEGORY="### BREAKING CHANGES"
              ;;
            *)
              CATEGORY="### Changed"
              ;;
          esac
          
          # Create changelog entry
          echo "## [Unreleased] - $CURRENT_DATE" > $TEMP_FILE
          echo "" >> $TEMP_FILE
          echo "$CATEGORY" >> $TEMP_FILE
          
          # Clean up PR title (remove conventional commit prefix)
          CLEAN_TITLE=$(echo "$PR_TITLE" | sed -E 's/^[a-z]+(\([^)]+\))?: //')
          
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "- $CLEAN_TITLE ([#${{ needs.check-changes.outputs.pr-number }}](${{ needs.check-changes.outputs.pr-url }})) by @${{ needs.check-changes.outputs.pr-author }}" >> $TEMP_FILE
          else
            echo "- $CLEAN_TITLE (Manual release by @${{ needs.check-changes.outputs.pr-author }})" >> $TEMP_FILE
          fi
          
          # Add affected workspaces info
          CHANGED_WORKSPACES="${{ needs.check-changes.outputs.changed-workspaces }}"
          if [ "$CHANGED_WORKSPACES" != "all" ] && [ -n "$CHANGED_WORKSPACES" ]; then
            echo "  - Affected workspaces: $CHANGED_WORKSPACES" >> $TEMP_FILE
          fi
          
          echo "" >> $TEMP_FILE
          
          # Prepend to existing CHANGELOG.md (after the header)
          if grep -q "## \[" CHANGELOG.md; then
            # Insert before first version entry
            awk '/^## \[/{if(!inserted){print temp_content; inserted=1}} {print}' temp_content="$(cat $TEMP_FILE)" CHANGELOG.md > CHANGELOG_NEW.md
            mv CHANGELOG_NEW.md CHANGELOG.md
          else
            # Append to end of header
            echo "" >> CHANGELOG.md
            cat $TEMP_FILE >> CHANGELOG.md
          fi
          
          rm $TEMP_FILE
          
          # Check if changelog was actually modified
          if git diff --quiet CHANGELOG.md; then
            echo "No changes to CHANGELOG.md"
            echo "updated=false" >> $GITHUB_OUTPUT
          else
            echo "CHANGELOG.md updated"
            echo "updated=true" >> $GITHUB_OUTPUT
            git add CHANGELOG.md
            git commit -m "docs: Update CHANGELOG.md"
            git push
          fi

  # Third job: Bump versions
  bump-versions:
    runs-on: ubuntu-latest
    needs: [check-changes, update-changelog]
    if: needs.update-changelog.outputs.changelog-updated == 'true'
    outputs:
      version-bumped: ${{ steps.bump.outputs.bumped }}
      new-versions: ${{ steps.bump.outputs.versions }}

    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Set up Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Pull latest changes
        run: git pull origin main

      - name: Bump versions
        id: bump
        run: |
          echo "Bumping versions for changed workspaces..."
          
          # Determine bump type from PR title or input
          PR_TITLE="${{ needs.check-changes.outputs.pr-title }}"
          RELEASE_TYPE="${{ github.event.inputs.release_type }}"
          
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BUMP_TYPE="$RELEASE_TYPE"
          elif [[ "$PR_TITLE" =~ ^BREAKING ]]; then
            BUMP_TYPE="major"
          elif [[ "$PR_TITLE" =~ ^feat ]]; then
            BUMP_TYPE="minor"
          else
            BUMP_TYPE="patch"
          fi
          
          echo "Using bump type: $BUMP_TYPE"
          
          # Run the bump command
          deno run -A jsr:@deno/bump-workspaces@^0.1/cli --$BUMP_TYPE
          
          # Check if any versions were actually bumped
          if git diff --quiet; then
            echo "No version changes detected"
            echo "bumped=false" >> $GITHUB_OUTPUT
            echo "versions=" >> $GITHUB_OUTPUT
          else
            echo "Versions bumped"
            echo "bumped=true" >> $GITHUB_OUTPUT
            
            # Get new versions
            VERSIONS=""
            # Read workspaces from deno.json
            WORKSPACES=$(jq -r '.workspace[]' deno.json | sed 's|^./||')
            for workspace in $WORKSPACES; do
              if [ -f "$workspace/deno.json" ]; then
                VERSION=$(grep '"version"' "$workspace/deno.json" | cut -d'"' -f4)
                VERSIONS="$VERSIONS $workspace:$VERSION"
              fi
            done
            echo "versions=$(echo $VERSIONS | xargs)" >> $GITHUB_OUTPUT
            
            git add .
            git commit -m "chore: Bump versions ($BUMP_TYPE)"
            git push
          fi

  # Fourth job: Update changelog with version numbers
  finalize-changelog:
    runs-on: ubuntu-latest
    needs: [check-changes, update-changelog, bump-versions]
    if: needs.bump-versions.outputs.version-bumped == 'true'

    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Pull latest changes
        run: git pull origin main

      - name: Update changelog with version numbers
        run: |
          # Replace [Unreleased] with actual version numbers
          NEW_VERSIONS="${{ needs.bump-versions.outputs.new-versions }}"
          CURRENT_DATE=$(date +"%Y-%m-%d")
          
          # Create version string from workspace versions
          VERSION_STRING=""
          for version_info in $NEW_VERSIONS; do
            workspace=$(echo $version_info | cut -d':' -f1)
            version=$(echo $version_info | cut -d':' -f2)
            if [ -z "$VERSION_STRING" ]; then
              VERSION_STRING="$workspace@$version"
            else
              VERSION_STRING="$VERSION_STRING, $workspace@$version"
            fi
          done
          
          # Replace the [Unreleased] entry
          sed -i "s/## \[Unreleased\] - $CURRENT_DATE/## [$VERSION_STRING] - $CURRENT_DATE/" CHANGELOG.md
          
          git add CHANGELOG.md
          git commit -m "docs: Finalize CHANGELOG.md with version numbers"
          git push

  # Fifth job: Publish to JSR
  publish:
    runs-on: ubuntu-latest
    needs: [check-changes, update-changelog, bump-versions, finalize-changelog]
    if: needs.bump-versions.outputs.version-bumped == 'true'
    timeout-minutes: 30

    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: canary

      - name: Pull latest changes
        run: git pull origin main

      - name: Publish to JSR
        run: |
          echo "Publishing updated workspaces to JSR..."
          
          # Publish each workspace that had changes
          CHANGED_WORKSPACES="${{ needs.check-changes.outputs.changed-workspaces }}"
          
          if [ "$CHANGED_WORKSPACES" = "all" ]; then
            echo "Publishing all workspaces..."
            deno publish
          else
            echo "Publishing specific workspaces: $CHANGED_WORKSPACES"
            for workspace in $CHANGED_WORKSPACES; do
              if [ -d "$workspace" ]; then
                echo "Publishing $workspace..."
                cd "$workspace"
                deno publish
                cd ..
              fi
            done
          fi

  # Final job: Create GitHub release
  create-release:
    runs-on: ubuntu-latest
    needs: [check-changes, update-changelog, bump-versions, finalize-changelog, publish]
    if: needs.bump-versions.outputs.version-bumped == 'true'

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Pull latest changes
        run: git pull origin main

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.bump-versions.outputs.new-versions }}
          name: Release ${{ needs.bump-versions.outputs.new-versions }}
          body: |
            ## What's Changed
            
            ${{ needs.check-changes.outputs.pr-title }}
            
            **Affected Workspaces:** ${{ needs.check-changes.outputs.changed-workspaces }}
            
            **Versions:**
            ${{ needs.bump-versions.outputs.new-versions }}
            
            **Full Changelog:** https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md
            
            ---
            
            ${{ needs.check-changes.outputs.pr-body }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
