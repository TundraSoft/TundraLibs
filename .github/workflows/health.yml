name: Weekly Health

# Drift detection: nothing in the repo changed, but the world did —
# new runtime releases, newly published CVEs. Runs a broader matrix
# than PR CI and files/updates a tracking issue on failure. Dispatchable on
# any branch to verify a fix; only a run on main touches the tracking issue.
on:
  schedule:
    - cron: '17 5 * * 1' # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: Runtime drift (${{ matrix.name }})
    runs-on: ubuntu-latest
    # DB services mirror ci.yml so the cron exercises the live-DB paths too
    # (drift can come from a driver's npm dep, not just the runtime). Keep in
    # sync with .github/workflows/ci.yml.
    env:
      DB_SCHEMA: ci
      LIVE_DB_REQUIRED: 'true'
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # PgBouncer in transaction mode in front of postgres, started by a step
      # below. Its role's default time zone is not UTC.
      PGBOUNCER_HOST: 127.0.0.1
      PGBOUNCER_PORT: '6432'
      PGBOUNCER_USER: ci_pooler
      PGBOUNCER_PASSWORD: ci-pooler
      PGBOUNCER_DB: ci_pooler
      MARIA_HOST: localhost
      MARIA_PORT: '3306'
      MARIA_USER: root
      MARIA_PASSWORD: mariadb
      MONGO_HOST: localhost
      MONGO_PORT: '27017'
      MONGO_USER: mongo
      MONGO_PASSWORD: mongo
      MONGO_AUTHSOURCE: admin
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      REDIS_DB: '1'
      MEMCACHED_HOST: localhost
      MEMCACHED_PORT: '11211'
      MEMCACHED_PORT2: '11212'
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: mariadb
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mongo:
        # mongo:8 refuses to start on the runners' Linux 6.19+ kernel
        # (SERVER-121912, tcmalloc rseq); return to 8 once a fixed release ships.
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: mongo
          MONGO_INITDB_ROOT_PASSWORD: mongo
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
      memcached:
        image: memcached:1
        ports:
          - 11211:11211
      memcached-drivers:
        image: memcached:1
        ports:
          - 11212:11211
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: deno-stable
            runtime: deno
            version: v2.x
          - name: deno-canary
            runtime: deno
            version: canary
          - name: bun-latest
            runtime: bun
            version: latest
          - name: node-22
            runtime: node
            version: 22.x
          - name: node-24
            runtime: node
            version: 24.x
          - name: node-current
            runtime: node
            version: current
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Deno
        if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: ${{ matrix.version }}

      - name: Setup Bun
        if: matrix.runtime != 'deno'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ matrix.runtime == 'bun' && matrix.version || 'latest' }}

      - name: Setup Node
        if: matrix.runtime == 'node'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: ${{ matrix.version }}

      - name: Install dependencies (bun)
        if: matrix.runtime != 'deno'
        run: bun install

      # Create the two per-package databases (see ci.yml) and wait for the
      # health-check-less memcached instances. Uses `docker exec` into the
      # service containers themselves (see ci.yml) rather than
      # apt-get-installing a separate client on the runner.
      - name: Prepare databases
        run: |
          pg_cid=$(docker ps -q --filter "publish=5432")
          maria_cid=$(docker ps -q --filter "publish=3306")
          for db in ${DB_SCHEMA}_norm ${DB_SCHEMA}_drivers; do
            docker exec -e PGPASSWORD=postgres "$pg_cid" psql -U postgres -c "CREATE DATABASE ${db};"
            docker exec "$maria_cid" mariadb -uroot -pmariadb -e "CREATE DATABASE IF NOT EXISTS ${db};"
          done
          for port in 11211 11212; do
            for _ in $(seq 1 30); do
              (echo > /dev/tcp/localhost/${port}) >/dev/null 2>&1 && break
              sleep 1
            done
          done

      # PgBouncer in transaction mode in front of the postgres service, for the
      # drivers pooler tests: the same two steps as ci.yml, explained there.
      - name: Start PgBouncer in transaction mode
        run: |
          set -euo pipefail
          pg_cid=$(docker ps -q --filter "publish=5432")
          docker exec -e PGPASSWORD=postgres "$pg_cid" psql -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE ${PGBOUNCER_USER} LOGIN PASSWORD '${PGBOUNCER_PASSWORD}';" \
            -c "ALTER ROLE ${PGBOUNCER_USER} SET timezone = 'Asia/Kolkata';" \
            -c "CREATE DATABASE ${PGBOUNCER_DB} OWNER ${PGBOUNCER_USER};"
          cfg="${RUNNER_TEMP}/pgbouncer"
          mkdir -p "$cfg"
          cat > "$cfg/pgbouncer.ini" <<EOF
          [databases]
          ${PGBOUNCER_DB} = host=127.0.0.1 port=5432
          [pgbouncer]
          listen_addr = 127.0.0.1
          listen_port = ${PGBOUNCER_PORT}
          auth_type = scram-sha-256
          auth_file = /etc/pgbouncer/userlist.txt
          pool_mode = transaction
          admin_users = ${PGBOUNCER_USER}
          EOF
          printf '"%s" "%s"\n' "$PGBOUNCER_USER" "$PGBOUNCER_PASSWORD" > "$cfg/userlist.txt"
          docker run -d --name pgbouncer --network host -v "$cfg:/cfg:ro" \
            --entrypoint bash postgres:17 -c 'set -e
              apt-get update -qq && apt-get install -y -qq pgbouncer >/dev/null
              mkdir -p /etc/pgbouncer
              cp /cfg/pgbouncer.ini /cfg/userlist.txt /etc/pgbouncer/
              chown -R postgres /etc/pgbouncer
              exec su postgres -c "pgbouncer /etc/pgbouncer/pgbouncer.ini"'
          for _ in $(seq 1 60); do
            docker exec -e PGPASSWORD="$PGBOUNCER_PASSWORD" pgbouncer \
              psql -h 127.0.0.1 -p "$PGBOUNCER_PORT" -U "$PGBOUNCER_USER" -d "$PGBOUNCER_DB" \
              -c 'SELECT 1' >/dev/null 2>&1 && exit 0
            sleep 2
          done
          docker logs pgbouncer
          exit 1

      - name: Check PgBouncer answers in transaction mode
        run: |
          through() {
            docker exec -e PGPASSWORD="$PGBOUNCER_PASSWORD" pgbouncer \
              psql -h 127.0.0.1 -p "$PGBOUNCER_PORT" -U "$PGBOUNCER_USER" -d "$1" \
              -v ON_ERROR_STOP=1 -Atc "$2"
          }
          zone=$(through "$PGBOUNCER_DB" "SELECT current_setting('TimeZone')")
          mode=$(through pgbouncer 'SHOW CONFIG' | grep '^pool_mode|' | cut -d'|' -f2)
          echo "$(through pgbouncer 'SHOW VERSION'): zone=${zone} pool_mode=${mode}"
          [ "$zone" = 'Asia/Kolkata' ] && [ "$mode" = 'transaction' ]

      # `@db/sqlite` downloads libsqlite3.so on first import, into a shared
      # cache. Under `--parallel` two workers race that download and mmap a
      # half-written file, killing the whole run with SIGBUS/SIGSEGV (exit
      # 135/139) — no failing assertion, so it reads like a mystery crash.
      # Import it once, single-threaded, so the parallel run finds it cached.
      # (Same fix as ci.yml; the weekly drift matrix needs it too — deno-canary
      # lost this race in run 29727450800.)
      - name: Warm sqlite3 native library
        if: matrix.runtime == 'deno'
        run: deno eval "await import('jsr:@db/sqlite@^0.13.0');"

      - name: Run tests (deno)
        if: matrix.runtime == 'deno'
        run: deno test --allow-all --parallel packages/

      - name: Run tests (bun)
        if: matrix.runtime == 'bun'
        run: bun test packages/

      - name: Run tests (node)
        if: matrix.runtime == 'node'
        run: node --import tsx --test 'packages/**/*.test.ts'

  audit:
    name: Full dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Deno
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: v2.x

      - name: Audit (all severities)
        run: deno audit

  consumer-docs:
    name: Shipped doc examples (consumer install)
    runs-on: ubuntu-latest
    # Drift of a different kind: the repo's own `deno check --doc-only` resolves
    # `@tundralibs/*` as workspace members, so a doc example importing a sibling
    # package passes in CI and fails for anyone who installed only that package.
    # This installs each package standalone from JSR and re-checks the docs that
    # actually shipped. Tests the PUBLISHED version, so it lags the working tree
    # by one release — that is the point.
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Deno
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: v2.x

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'

      - name: Check shipped docs from a consumer install
        run: deno run -A .github/scripts/consumer-doc-check.ts

  close-on-success:
    name: Close health issue on a green run
    needs: [drift, audit, consumer-docs]
    if: success() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Close any open health issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing=$(gh issue list --label ci-health --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "Resolved — this run passed: ${RUN_URL}"
            echo "Closed issue #$existing"
          else
            echo "No open health issue to close"
          fi

  report:
    name: File issue on failure
    needs: [drift, audit, consumer-docs]
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Create or update health issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DRIFT: ${{ needs.drift.result }}
          AUDIT: ${{ needs.audit.result }}
          DOCS: ${{ needs.consumer-docs.result }}
        run: |
          # Title must match the frontmatter `title` in the issue template.
          title="Weekly health check failed"
          # Body is the shared issue template with its frontmatter stripped —
          # single source of truth in .github/ISSUE_TEMPLATE/ci_health.md.
          template=".github/ISSUE_TEMPLATE/ci_health.md"
          body="$(awk 'f>=2{print; next} /^---[[:space:]]*$/{f++}' "$template")"

          failing=""
          [ "$DRIFT" = "failure" ] && failing="$failing runtime-drift"
          [ "$AUDIT" = "failure" ] && failing="$failing dependency-audit"
          [ "$DOCS" = "failure" ] && failing="$failing consumer-docs"
          [ -z "$failing" ] && failing=" (see run)"

          body="${body}

          **Failing job(s):**${failing}
          **Run:** ${RUN_URL}"

          existing=$(gh issue list --label ci-health --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still failing —${failing}: ${RUN_URL}"
            echo "Updated issue #$existing"
          else
            gh issue create --title "$title" --body "$body" --label ci-health
            echo "Created new health issue"
          fi
