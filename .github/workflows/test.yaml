name: "Test & Quality Gates"

on:
  workflow_dispatch:
    inputs:
      deno_version:
        description: "Deno version to test with"
        required: false
        default: "v2.x"
        type: choice
        options:
          - v2.x
          - canary
      submit_reports:
        description: "Submit coverage and security reports"
        required: false
        default: false
        type: boolean
  push:
    paths-ignore:
      - "**.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".vscode/**"
      - ".dockerignore"
      - ".gitignore"
      - "LICENSE"
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  # Quality checks (format, lint, type check)
  quality:
    name: "Quality Checks"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Setup Deno"
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ github.event.inputs.deno_version || 'v2.x' }}

      - name: "Check formatting"
        run: deno fmt --check

      - name: "Run linter"
        run: deno lint

      - name: "Type checking"
        run: deno check **/*.ts

      - name: "Spell check"
        uses: crate-ci/typos@master
        with:
          config: ./.github/typos.toml

  # Test suite with coverage
  test:
    name: "Tests (${{ matrix.os }}, ${{ matrix.deno }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: quality

    strategy:
      fail-fast: false
      matrix:
        # os: [ubuntu-latest, windows-latest, macos-latest]
        os: [ubuntu-latest]
        deno: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{}"]', github.event.inputs.deno_version)) || fromJSON('["v2.x", "canary"]') }}

    services:
      memcache:
        image: memcached
        ports:
          - 11211:11211
      redis:
        image: redis
        ports:
          - 6379:6379
      postgres:
        image: postgres:latest
        env:
          POSTGRES_PASSWORD: postgrespw
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      maria:
        image: mariadb
        env:
          MARIADB_ROOT_PASSWORD: mariapw2
          MARIADB_USER: maria
          MARIADB_PASSWORD: mariapw
          MARIADB_DATABASE: mysql
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 5
      mongo:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        env:
          MONGO_INITDB_ROOT_USERNAME: mongo
          MONGO_INITDB_ROOT_PASSWORD: mongopw

    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Setup Deno"
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ matrix.deno }}

      - name: "Setup LCOV"
        if: matrix.os == 'ubuntu-latest' && matrix.deno == 'v2.x'
        run: sudo apt install -y lcov

      - name: "Run tests with coverage"
        run: |
          deno task test:run
          deno coverage coverage --lcov --output=coverage.lcov
        env:
          MEMCACHED_HOST: localhost
          MEMCACHED_PORT: 11211
          MEMCACHED_SIZE: 10
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespw
          POSTGRES_DB: postgres
          MARIA_HOST: localhost
          MARIA_PORT: 3306
          MARIA_USER: maria
          MARIA_PASSWORD: mariapw
          MARIA_DB: mysql
          MONGODB_HOST: localhost
          MONGODB_PORT: 27017
          MONGODB_USERNAME: mongo
          MONGODB_PASSWORD: mongopw
          MONGODB_DATABASE: mongo

      - name: "Upload coverage to Codecov"
        if: matrix.os == 'ubuntu-latest' && matrix.deno == 'v2.x' && (github.event.inputs.submit_reports == 'true' || github.event_name != 'workflow_dispatch')
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: coverage.lcov
          flags: unittests
          name: deno-${{ matrix.deno }}

      - name: "Prepare LCOV for Sonar"
        if: matrix.os == 'ubuntu-latest' && matrix.deno == 'v2.x' && (github.event.inputs.submit_reports == 'true' || github.event_name != 'workflow_dispatch')
        run: |
          mkdir -p coverage
          cp coverage.lcov coverage/report.lcov

      - name: "Run SonarCloud analysis"
        if: matrix.os == 'ubuntu-latest' && matrix.deno == 'v2.x' && (github.event.inputs.submit_reports == 'true' || github.event_name != 'workflow_dispatch')
        uses: SonarSource/sonarcloud-github-action@v1
        with:
          projectBaseDir: .
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Performance benchmarks (Ubuntu only)
  benchmark:
    name: "Benchmarks"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality
    if: github.event_name == 'pull_request'

    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Setup Deno"
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: "Run benchmarks"
        run: deno task test:bench || true

      - name: "Summary"
        run: echo "✅ Benchmarks completed"

  # Security scanning
  security:
    name: "Security Scan"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality

    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Run Trivy vulnerability scanner"
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"

      - name: "Upload Trivy scan results"
        if: github.event.inputs.submit_reports == 'true' || github.event_name != 'workflow_dispatch'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-results.sarif"

  # Summary job
  summary:
    name: "Quality Gate Summary"
    runs-on: ubuntu-latest
    needs: [quality, test, benchmark, security]
    if: always()

    steps:
      - name: "Check results"
        run: |
          echo "🔍 Quality Gate Results:"
          echo "- Quality checks: ${{ needs.quality.result }}"
          echo "- Tests: ${{ needs.test.result }}"
          echo "- Benchmarks: ${{ needs.benchmark.result }}"
          echo "- Security: ${{ needs.security.result }}"

          if [ "${{ needs.quality.result }}" != "success" ] || [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.security.result }}" != "success" ]; then
            echo "❌ Quality gates failed"
            exit 1
          else
            echo "✅ All quality gates passed"
          fi
