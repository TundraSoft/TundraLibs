name: CI

# Runs on every branch push. The pull_request trigger exists for FORK
# PRs only (their push events fire in the fork, so check runs would
# never attach to the upstream PR); same-repo PRs are satisfied by the
# push run on the head commit, and the per-job `if` skips the duplicate
# pull_request run (skipped checks still satisfy branch protection).
on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, type-check
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Deno
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: v2.x

      - name: Format check
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Type check
        run: deno task check

      - name: Edge-safety (drivers)
        # The edge/HTTP drivers must stay bundleable for edge/serverless
        # runtimes: each engine's runtime import graph may not reach
        # node:net/tls/dgram/dns/http/https, compat net/udp/webserver/websocket,
        # a native SQLite binding, or a DB TCP wire protocol. Fails if a barrel
        # re-introduces one of those. (Engines covered are enumerated in the
        # check-edge-safety.ts script.)
        run: deno task --cwd packages/drivers check:edge-safety

      - name: Generated config drift check
        # release-please config/manifest, labeler.yml, workspace meta and
        # issue templates are generated from the packages/ directory —
        # never hand-maintained. Fails if a package was added/removed
        # without running `deno task workspace:sync`.
        run: deno task workspace:sync:check

  audit:
    name: Dependency audit (high+)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Deno
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: v2.x

      - name: Audit dependencies
        # Fails only on high/critical; the weekly health run reports all
        # severities and files an issue.
        run: deno audit --level=high

  publish-dry-run:
    name: JSR publish dry-run
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Deno
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: v2.x

      - name: Dry-run publish (slow-types / metadata gate)
        run: deno publish --dry-run

  test:
    name: Test (${{ matrix.name }})
    # release-please branches only ever bump a version field and prepend a
    # CHANGELOG entry (see release-please.yml) -- the real source diff they
    # represent was already fully tested when it merged to main. The branch
    # ruleset requires these exact check names to report, though, so the JOB
    # must still run (a job skipped at the `if:` level never posts its
    # matrix-expanded check names at all, which permanently blocks merging --
    # unlike a *step* skipped inside a running job, which still reports).
    # Every real step below is individually gated on IS_RELEASE_PLEASE_BRANCH
    # instead, so the job completes in seconds and reports green without
    # re-running the full 4-runtime/7-service suite on release-please's own
    # pushes. Service containers still spin up (no per-service `if:` exists),
    # but that's a health-check wait, not a multi-minute test run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    # Live-DB fixtures (NORM + drivers) read these via envArgs, which merges
    # OS env. Services below are per-JOB, so each matrix runtime gets its own
    # isolated containers — cross-runtime overlap is impossible. DB_SCHEMA
    # namespaces NORM vs drivers WITHIN a job (they run together under
    # `deno test --parallel`): each package targets `${DB_SCHEMA}_<pkg>`.
    env:
      IS_RELEASE_PLEASE_BRANCH: ${{ startsWith(github.ref_name, 'release-please--branches--') }}
      DB_SCHEMA: ci
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      MARIA_HOST: localhost
      MARIA_PORT: '3306'
      MARIA_USER: root
      MARIA_PASSWORD: mariadb
      MONGO_HOST: localhost
      MONGO_PORT: '27017'
      MONGO_USER: mongo
      MONGO_PASSWORD: mongo
      MONGO_AUTHSOURCE: admin
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      # cacher uses logical DB 1; the drivers redis suite uses the default DB 0.
      REDIS_DB: '1'
      MEMCACHED_HOST: localhost
      # cacher uses the primary instance; drivers gets a dedicated one because
      # both suites call the global memcached flush() (no logical DBs to isolate).
      MEMCACHED_PORT: '11211'
      MEMCACHED_PORT2: '11212'
      # Tracer's OTLP conformance test probes this and SKIPS when unreachable,
      # so a contributor without a local collector still gets a green suite.
      OTLP_ENDPOINT: http://localhost:4318
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: mariadb
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mongo:
        image: mongo:8
        env:
          MONGO_INITDB_ROOT_USERNAME: mongo
          MONGO_INITDB_ROOT_PASSWORD: mongo
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
      memcached:
        image: memcached:1
        ports:
          - 11211:11211
      # Dedicated instance for the drivers memcached suite (see MEMCACHED_PORT2).
      memcached-drivers:
        image: memcached:1
        ports:
          - 11212:11211
      # OTLP collector for tracer's conformance test. The point is to assert a
      # REAL collector accepts our payload, rather than only that it matches
      # our own fixtures — a self-agreeing encoder can still be wrong.
      #
      # No config file is mounted: the stock image ships a default config with
      # OTLP receivers on 4317 (gRPC) and 4318 (HTTP), and only HTTP is used.
      # That matters because service containers start BEFORE checkout, so a
      # repo config file would not exist yet.
      #
      # Version-pinned to what the payload was verified against. Note the
      # collector is deliberately lenient about int64-as-number, so it does NOT
      # catch a numeric `*TimeUnixNano`; that stays a unit-test assertion.
      otel-collector:
        image: otel/opentelemetry-collector:0.158.0
        ports:
          - 4318:4318
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: deno
            runtime: deno
          - name: bun
            runtime: bun
          - name: node-22
            runtime: node
            node-version: 22.x
          - name: node-24
            runtime: node
            node-version: 24.x
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # Full history only on the deno leg, which is the one that runs
          # SonarQube (needs it to attribute new/changed code and blame
          # accurately -- shallow clones degrade new-code detection). The
          # bun/node legs never touch Sonar, so they get the default shallow
          # clone.
          fetch-depth: ${{ (matrix.runtime == 'deno' && env.IS_RELEASE_PLEASE_BRANCH != 'true') && '0' || '1' }}

      - name: Setup Deno
        if: matrix.runtime == 'deno' && env.IS_RELEASE_PLEASE_BRANCH != 'true'
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: v2.x

      # Bun installs node_modules for the bun and node runs.
      - name: Setup Bun
        if: matrix.runtime != 'deno' && env.IS_RELEASE_PLEASE_BRANCH != 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Setup Node
        if: matrix.runtime == 'node' && env.IS_RELEASE_PLEASE_BRANCH != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies (bun)
        if: matrix.runtime != 'deno' && env.IS_RELEASE_PLEASE_BRANCH != 'true'
        run: bun install

      # Postgres/MariaDB need the two per-package databases created up front
      # (the service `env` only seeds one). Mongo auto-creates on first write.
      # Run the CREATE DATABASE calls via `docker exec` into the service
      # containers themselves (the postgres/mariadb images already ship
      # their own client -- their healthchecks use it) instead of
      # apt-get-installing a separate copy on the runner: no package
      # install, no apt mirror dependency.
      # Also block until memcached accepts connections — its image ships no
      # health-check client, so `services:` can't gate on it.
      - name: Prepare databases
        if: env.IS_RELEASE_PLEASE_BRANCH != 'true'
        run: |
          pg_cid=$(docker ps -q --filter "publish=5432")
          maria_cid=$(docker ps -q --filter "publish=3306")
          for db in ${DB_SCHEMA}_norm ${DB_SCHEMA}_drivers; do
            docker exec -e PGPASSWORD=postgres "$pg_cid" psql -U postgres -c "CREATE DATABASE ${db};"
            docker exec "$maria_cid" mariadb -uroot -pmariadb -e "CREATE DATABASE IF NOT EXISTS ${db};"
          done
          for port in 11211 11212; do
            for _ in $(seq 1 30); do
              (echo > /dev/tcp/localhost/${port}) >/dev/null 2>&1 && break
              sleep 1
            done
          done

      # `@db/sqlite` downloads libsqlite3.so on first import, into a shared
      # cache. Under `--parallel` two workers race that download and mmap a
      # half-written file, killing the whole run with SIGBUS/SIGSEGV (exit
      # 135/139) — no failing assertion, so it reads like a mystery crash.
      # Import it once, single-threaded, so the parallel run finds it cached.
      - name: Warm sqlite3 native library
        if: matrix.runtime == 'deno' && env.IS_RELEASE_PLEASE_BRANCH != 'true'
        run: deno eval "await import('jsr:@db/sqlite@^0.13.0');"

      # Each runtime leg emits its OWN LCOV and uploads it as an artifact. The
      # separate `analysis` job then collates all three and feeds the union to
      # Codecov and SonarQube — it never re-runs a test. Node and Bun cover the
      # runtime-specific code the Deno leg cannot reach (WebServer's Node path,
      # sockets), so the merged report is the honest coverage picture.
      - name: Run tests (deno)
        if: matrix.runtime == 'deno' && env.IS_RELEASE_PLEASE_BRANCH != 'true'
        run: deno test --allow-all --parallel --coverage=./coverage packages/

      - name: Generate LCOV (deno)
        if: matrix.runtime == 'deno' && env.IS_RELEASE_PLEASE_BRANCH != 'true'
        run: |
          mkdir -p lcov
          deno coverage ./coverage --lcov --output=lcov/deno.lcov
          # Deno emits absolute SF: paths; relativize to the repo root so the
          # SF: entries resolve for Codecov and the Sonar scanner. Bun and Node
          # already emit root-relative paths when run from the repo root.
          sed -i "s|SF:${GITHUB_WORKSPACE}/|SF:|g" lcov/deno.lcov

      - name: Run tests (bun)
        if: matrix.runtime == 'bun' && env.IS_RELEASE_PLEASE_BRANCH != 'true'
        run: |
          mkdir -p lcov
          bun test --coverage --coverage-reporter=lcov --coverage-dir=./lcov packages/
          mv lcov/lcov.info lcov/bun.lcov

      - name: Run tests (node)
        if: matrix.runtime == 'node' && env.IS_RELEASE_PLEASE_BRANCH != 'true'
        run: |
          # Coverage only on node-24 (identical code across node legs — one
          # LCOV is enough); node-22 still runs the full suite for compat.
          if [ "${{ matrix.name }}" = 'node-24' ]; then
            mkdir -p lcov
            node --import tsx --test --experimental-test-coverage \
              --test-reporter=spec --test-reporter-destination=stdout \
              --test-reporter=lcov --test-reporter-destination=lcov/node.lcov \
              'packages/**/*.test.ts'
          else
            node --import tsx --test 'packages/**/*.test.ts'
          fi

      # One artifact per runtime with coverage (deno, bun, node-24). node-22
      # runs tests but produces no LCOV, so it is skipped. Push-only — PRs are
      # covered by their branch push run.
      - name: Upload LCOV artifact
        if: github.event_name == 'push' && env.IS_RELEASE_PLEASE_BRANCH != 'true' && matrix.name != 'node-22'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lcov-${{ matrix.name }}
          path: lcov/*.lcov
          if-no-files-found: error
          retention-days: 1

  # Collates the per-runtime LCOV artifacts and reports the UNION to Codecov
  # and SonarQube. Runs after the test matrix (so every artifact exists) and
  # never re-runs a test. Push-only: same-repo PRs are covered by their branch
  # push run, and fork PRs lack the secrets.
  analysis:
    name: Coverage & analysis
    needs: test
    if: github.event_name == 'push' && !startsWith(github.ref_name, 'release-please--branches--')
    runs-on: ubuntu-latest
    env:
      # Job-level so the `env.*_TOKEN != ''` guards below can read them — each
      # reporting step self-disables until its secret is configured (and on
      # fork PRs, which never receive secrets). SonarQube Cloud host is fixed.
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: https://sonarcloud.io
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # Full history so Sonar attributes new/changed code and blame
          # accurately (shallow clones degrade new-code detection).
          fetch-depth: 0

      - name: Download runtime LCOV reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: lcov-*
          path: lcov
          merge-multiple: true

      # Reporting side-channels — results surface as their own status checks
      # (codecov/*, the SonarQube gate), so an upload/scan failure (token not
      # provisioned, transient outage) must never fail the pipeline. One
      # Codecov upload per runtime flag so a missing leg carries forward (see
      # codecov.yml) instead of dropping the union.
      - name: Upload coverage to Codecov (deno)
        if: env.CODECOV_TOKEN != ''
        continue-on-error: true
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov/deno.lcov
          flags: deno
          fail_ci_if_error: false
      - name: Upload coverage to Codecov (bun)
        if: env.CODECOV_TOKEN != ''
        continue-on-error: true
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov/bun.lcov
          flags: bun
          fail_ci_if_error: false
      - name: Upload coverage to Codecov (node)
        if: env.CODECOV_TOKEN != ''
        continue-on-error: true
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov/node.lcov
          flags: node
          fail_ci_if_error: false

      - name: SonarQube Cloud scan
        # Coverage from all three runtime LCOVs (sonar-project.properties
        # `reportPaths`); the scan analyses the checked-out source.
        if: env.SONAR_TOKEN != ''
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
