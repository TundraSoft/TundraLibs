name: 'Edge Release'

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
    paths:
      - cacher/**
      - crypt/**
      - dam/**
      - guardian/**
      - id/**
      - norm/**
      - openapi/**
      - restler/**
      - slogger/**
      - utils/**

jobs:
  edge-release:
    name: 'Publish Edge Versions'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: 'Checkout code'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          
      - name: 'Setup Deno'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          
      - name: 'Detect changed workspaces'
        id: changes
        run: |
          echo "🔍 Detecting workspace changes..."
          
          # Get base and head commits
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          
          echo "Comparing $BASE_SHA..$HEAD_SHA"
          
          # Get all workspaces from deno.json
          WORKSPACES=$(jq -r '.workspace[]' deno.json | sed 's|^./||')
          CHANGED_WORKSPACES=""
          
          # Check each workspace for changes
          for workspace in $WORKSPACES; do
            if git diff --name-only $BASE_SHA..$HEAD_SHA | grep -q "^$workspace/"; then
              CHANGED_WORKSPACES="$CHANGED_WORKSPACES $workspace"
              echo "✅ Changes detected in: $workspace"
            fi
          done
          
          if [ -z "$CHANGED_WORKSPACES" ]; then
            echo "ℹ️  No workspace changes detected"
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "workspaces=" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "workspaces=$(echo $CHANGED_WORKSPACES | xargs)" >> $GITHUB_OUTPUT
            echo "📦 Changed workspaces: $CHANGED_WORKSPACES"
          fi
          
      - name: 'Create edge versions'
        if: steps.changes.outputs.changed == 'true'
        id: edge-versions
        run: |
          CHANGED_WORKSPACES="${{ steps.changes.outputs.workspaces }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"
          SHORT_SHA="${{ github.event.pull_request.head.sha }}"
          SHORT_SHA=${SHORT_SHA:0:7}
          
          EDGE_VERSIONS=""
          
          for workspace in $CHANGED_WORKSPACES; do
            if [ -f "$workspace/deno.json" ]; then
              # Get current version
              CURRENT_VERSION=$(jq -r '.version' "$workspace/deno.json")
              
              # Create edge version
              EDGE_VERSION="${CURRENT_VERSION}-edge.${PR_NUMBER}.${SHORT_SHA}"
              
              echo "🏷️  $workspace: $CURRENT_VERSION → $EDGE_VERSION"
              
              # Update deno.json with edge version
              jq --arg version "$EDGE_VERSION" '.version = $version' "$workspace/deno.json" > "$workspace/deno.json.tmp"
              mv "$workspace/deno.json.tmp" "$workspace/deno.json"
              
              EDGE_VERSIONS="$EDGE_VERSIONS $workspace@$EDGE_VERSION"
            fi
          done
          
          echo "versions=$EDGE_VERSIONS" >> $GITHUB_OUTPUT
          
      - name: 'Publish edge versions'
        if: steps.changes.outputs.changed == 'true'
        run: |
          CHANGED_WORKSPACES="${{ steps.changes.outputs.workspaces }}"
          SUCCESS_COUNT=0
          FAILED_COUNT=0
          FAILED_WORKSPACES=""
          
          echo "🚀 Publishing edge versions..."
          
          for workspace in $CHANGED_WORKSPACES; do
            if [ -d "$workspace" ]; then
              echo "📦 Publishing $workspace..."
              cd "$workspace"
              
              # Validate before publishing
              if [ ! -f "mod.ts" ]; then
                echo "⚠️  $workspace/mod.ts not found, skipping"
                cd ..
                continue
              fi
              
              # Dry run first
              if deno publish --dry-run --quiet; then
                # Actually publish
                if deno publish --quiet; then
                  echo "✅ Published $workspace"
                  SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
                else
                  echo "❌ Failed to publish $workspace"
                  FAILED_COUNT=$((FAILED_COUNT + 1))
                  FAILED_WORKSPACES="$FAILED_WORKSPACES $workspace"
                fi
              else
                echo "❌ Dry run failed for $workspace"
                FAILED_COUNT=$((FAILED_COUNT + 1))
                FAILED_WORKSPACES="$FAILED_WORKSPACES $workspace"
              fi
              
              cd ..
            fi
          done
          
          echo "📊 Publishing Results:"
          echo "✅ Success: $SUCCESS_COUNT"
          echo "❌ Failed: $FAILED_COUNT"
          if [ $FAILED_COUNT -gt 0 ]; then
            echo "Failed workspaces: $FAILED_WORKSPACES"
          fi
          
      - name: 'Comment on PR'
        if: steps.changes.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const changedWorkspaces = '${{ steps.changes.outputs.workspaces }}'.split(' ');
            const edgeVersions = '${{ steps.edge-versions.outputs.versions }}';
            const prNumber = '${{ github.event.pull_request.number }}';
            const shortSha = '${{ github.event.pull_request.head.sha }}'.substring(0, 7);
            
            let comment = `## 🚀 Edge Versions Published\n\n`;
            comment += `This PR has published bleeding-edge versions for testing:\n\n`;
            
            // Parse edge versions
            const versions = edgeVersions.trim().split(' ');
            versions.forEach(versionInfo => {
              if (versionInfo) {
                comment += `- \`${versionInfo}\`\n`;
              }
            });
            
            comment += `\n### 🧪 Testing This PR\n\n`;
            comment += `\`\`\`bash\n`;
            
            versions.forEach(versionInfo => {
              if (versionInfo) {
                comment += `deno add ${versionInfo}\n`;
              }
            });
            
            comment += `\`\`\`\n\n`;
            comment += `⚠️ **Warning**: Edge versions are unstable and should only be used for testing.\n\n`;
            comment += `📦 **Stable version**: Use the latest numbered version for production.`;
            
            // Find existing edge comment to update
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const existingComment = comments.data.find(comment => 
              comment.body.includes('🚀 Edge Versions Published')
            );
            
            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }