name: 'Performance Benchmarks'

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.vscode/**'
      - '.dockerignore'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.vscode/**'
      - '.dockerignore'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      create_baseline:
        description: 'Create new performance baseline'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  benchmark:
    name: 'Run Benchmarks'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: 'Checkout code'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: 'Setup Deno'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          
      - name: 'Run benchmarks'
        run: |
          echo "🏃‍♂️ Running performance benchmarks..."
          
          # Run benchmarks and capture output
          if deno task test:bench --json > benchmark-results.json; then
            echo "✅ Benchmarks completed successfully"
          else
            echo "⚠️  Some benchmarks may have failed, but continuing..."
          fi
          
          # Show results summary
          if [ -f benchmark-results.json ]; then
            echo "📊 Benchmark Results Available"
            echo "File size: $(wc -c < benchmark-results.json) bytes"
          fi
          
      - name: 'Process benchmark results'
        if: github.event_name == 'pull_request'
        run: |
          if [ -f benchmark-results.json ]; then
            echo "📊 Processing benchmark results for PR..."
            
            # Create a summary for the PR
            echo "## 🏃‍♂️ Benchmark Results" >> pr-comment.md
            echo "" >> pr-comment.md
            echo "Performance benchmarks completed for this PR." >> pr-comment.md
            echo "" >> pr-comment.md
            echo "### Summary" >> pr-comment.md
            echo "- Benchmark file generated: \`benchmark-results.json\`" >> pr-comment.md
            echo "- Total size: $(wc -c < benchmark-results.json) bytes" >> pr-comment.md
            echo "" >> pr-comment.md
            echo "⚠️ **Note**: Detailed performance analysis requires manual review of the benchmark results." >> pr-comment.md
            echo "" >> pr-comment.md
            echo "<details><summary>Raw Benchmark Data (click to expand)</summary>" >> pr-comment.md
            echo "" >> pr-comment.md
            echo '```json' >> pr-comment.md
            head -50 benchmark-results.json >> pr-comment.md
            if [ $(wc -l < benchmark-results.json) -gt 50 ]; then
              echo "..." >> pr-comment.md
              echo "(truncated - full results available in workflow artifacts)" >> pr-comment.md
            fi
            echo '```' >> pr-comment.md
            echo "" >> pr-comment.md
            echo "</details>" >> pr-comment.md
          else
            echo "## 🏃‍♂️ Benchmark Results" >> pr-comment.md
            echo "" >> pr-comment.md
            echo "⚠️ No benchmark results file was generated." >> pr-comment.md
          fi
          
      - name: 'Comment on PR'
        if: github.event_name == 'pull_request' && hashFiles('pr-comment.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const comment = fs.readFileSync('pr-comment.md', 'utf8');
            
            // Find existing benchmark comment
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const existingComment = comments.data.find(comment => 
              comment.body.includes('🏃‍♂️ Benchmark Results')
            );
            
            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: comment
              });
              console.log('Updated existing benchmark comment');
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
              console.log('Created new benchmark comment');
            }
            
      - name: 'Upload benchmark results'
        if: always() && hashFiles('benchmark-results.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.sha }}
          path: benchmark-results.json
          retention-days: 30
          
      - name: 'Create baseline'
        if: github.event.inputs.create_baseline == 'true' && github.ref == 'refs/heads/main'
        run: |
          echo "📊 Creating new performance baseline..."
          
          if [ -f benchmark-results.json ]; then
            # Store baseline (you could commit this or store it elsewhere)
            cp benchmark-results.json benchmark-baseline.json
            
            echo "✅ Baseline created: benchmark-baseline.json"
            echo "Size: $(wc -c < benchmark-baseline.json) bytes"
          else
            echo "❌ Cannot create baseline - no benchmark results available"
            exit 1
          fi