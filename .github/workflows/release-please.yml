name: Release Please

on:
  push:
    branches:
      - main
  # Manual escape hatch for the known release-please failure where a
  # release gets tagged (by hand, matching the existing tag/release
  # format) outside the action's own run — e.g. after manual tag surgery
  # recovering from "untagged, merged release PRs outstanding" (see
  # googleapis/release-please#1946). The automatic `publish` job only
  # fires in the SAME run where release-please's action reports it just
  # created a release, so a release stitched together by hand afterward
  # is never picked up on its own. This lets a maintainer publish exactly
  # one already-released package on demand instead.
  workflow_dispatch:
    inputs:
      path:
        description: Package directory to publish (must already be tagged/released)
        required: true
        type: choice
        options:
          - packages/ambient
          - packages/cacher
          - packages/compat
          - packages/cronus
          - packages/crypt
          - packages/doctor
          - packages/drivers
          - packages/guardian
          - packages/id
          - packages/metro-man
          - packages/norm
          - packages/oql
          - packages/pact
          - packages/radrouter
          - packages/rapid
          - packages/restler
          - packages/rpc
          - packages/slogger
          - packages/tracer
          - packages/utils

permissions:
  contents: read

# Never run two "Maintain release PRs" jobs at once: a second run reading
# repo state while a first run is mid-write races on the same git refs
# (release-please's own tag/PR bookkeeping is not safe under concurrent
# invocations). Queue instead of running in parallel; never cancel a run
# that's already mutating state.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Maintain release PRs
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          # RELEASE_PLEASE_TOKEN is a fine-grained PAT (see
          # .github/REPO-SETTINGS.md). PRs created with the default
          # GITHUB_TOKEN do not trigger CI, so release PRs would sit
          # without required checks. Falls back to GITHUB_TOKEN so the
          # workflow still functions before the PAT is configured.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish ${{ matrix.path }} to JSR
    needs: release-please
    # Publishes ONLY from the real repository — the internal staging repo
    # can merge release PRs to validate the pipeline without shipping.
    # Either release-please just created a release in THIS run, or a
    # maintainer explicitly asked to (re-)publish one package by hand —
    # see the workflow_dispatch comment above for why that path exists.
    if: |
      github.repository == 'TundraSoft/TundraLibs' &&
      (
        (needs.release-please.outputs.paths_released != '' &&
         needs.release-please.outputs.paths_released != '[]') ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # JSR tokenless OIDC publish
    strategy:
      fail-fast: false
      matrix:
        path: ${{ github.event_name == 'workflow_dispatch' && fromJson(format('["{0}"]', inputs.path)) || fromJson(needs.release-please.outputs.paths_released) }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Deno
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: v2.x

      - name: Publish package
        working-directory: ${{ matrix.path }}
        # Packages in this matrix publish in parallel with no ordering, but
        # several depend on each other in-repo (e.g. doctor/tracer on
        # utils). If a dependency is still mid-publish, `deno publish` fails
        # with "unresolvable 'jsr:' dependency" -- retry with a short
        # backoff instead of a hard failure, giving the dependency time to
        # land rather than requiring a manual rerun.
        run: |
          for attempt in 1 2 3 4 5; do
            if deno publish; then
              exit 0
            fi
            echo "Publish attempt ${attempt} failed (possibly an in-repo dependency not live yet) -- retrying in 30s..."
            sleep 30
          done
          echo "::error::deno publish failed after 5 attempts"
          exit 1
