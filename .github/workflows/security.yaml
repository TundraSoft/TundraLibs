name: 'Security Scan'

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.vscode/**'
      - '.dockerignore'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.vscode/**'
      - '.dockerignore'
      - '.gitignore'
      - 'LICENSE'
  schedule:
    # Daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      scan_type:
        description: 'Type of scan to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - filesystem
          - repository
          - config
      upload_results:
        description: 'Upload results to GitHub Security'
        required: false
        default: true
        type: boolean

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  security-scan:
    name: 'Trivy Security Scan'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: 'Checkout code'
        uses: actions/checkout@v4
        
      - name: 'Setup scan parameters'
        id: scan-params
        run: |
          SCAN_TYPE="${{ github.event.inputs.scan_type || 'all' }}"
          UPLOAD="${{ github.event.inputs.upload_results != 'false' }}"
          
          echo "scan-type=$SCAN_TYPE" >> $GITHUB_OUTPUT
          echo "upload=$UPLOAD" >> $GITHUB_OUTPUT
          
          echo "🛡️  Security scan configuration:"
          echo "- Scan type: $SCAN_TYPE"
          echo "- Upload results: $UPLOAD"
          
      - name: 'Run filesystem scan'
        if: steps.scan-params.outputs.scan-type == 'all' || steps.scan-params.outputs.scan-type == 'filesystem'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          
      - name: 'Run repository scan'
        if: steps.scan-params.outputs.scan-type == 'all' || steps.scan-params.outputs.scan-type == 'repository'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'repo'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-repo-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          
      - name: 'Run config scan'
        if: steps.scan-params.outputs.scan-type == 'all' || steps.scan-params.outputs.scan-type == 'config'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-config-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          
      - name: 'Merge SARIF results'
        if: steps.scan-params.outputs.scan-type == 'all'
        run: |
          echo "🔄 Merging SARIF results..."
          
          # Create merged SARIF file
          cat > merged-results.sarif << 'EOF'
          {
            "$schema": "https://schemastore.azurewebsites.net/schemas/json/sarif-2.1.0.json",
            "version": "2.1.0",
            "runs": []
          }
          EOF
          
          # Merge all SARIF files if they exist
          SARIF_FILES=""
          for file in trivy-*-results.sarif; do
            if [ -f "$file" ]; then
              SARIF_FILES="$SARIF_FILES $file"
            fi
          done
          
          if [ -n "$SARIF_FILES" ]; then
            echo "Merging: $SARIF_FILES"
            # Simple merge - combine runs arrays
            # Note: This is a basic merge, for production you might want a more sophisticated approach
            jq -s '{"$schema": "https://schemastore.azurewebsites.net/schemas/json/sarif-2.1.0.json", "version": "2.1.0", "runs": map(.runs[]) | flatten}' $SARIF_FILES > merged-results.sarif
          fi
          
      - name: 'Upload SARIF results'
        if: steps.scan-params.outputs.upload == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: |
            ${{ steps.scan-params.outputs.scan-type == 'all' && 'merged-results.sarif' || format('trivy-{0}-results.sarif', steps.scan-params.outputs.scan-type) }}
          category: 'trivy-${{ steps.scan-params.outputs.scan-type }}'
          
      - name: 'Process scan results'
        run: |
          echo "📊 Security scan results:"
          
          # Count findings in SARIF files
          TOTAL_FINDINGS=0
          CRITICAL_FINDINGS=0
          HIGH_FINDINGS=0
          
          for file in trivy-*-results.sarif; do
            if [ -f "$file" ]; then
              FINDINGS=$(jq '[.runs[].results[] // empty] | length' "$file" 2>/dev/null || echo "0")
              CRITICAL=$(jq '[.runs[].results[]? | select(.level == "error")] | length' "$file" 2>/dev/null || echo "0")
              HIGH=$(jq '[.runs[].results[]? | select(.level == "warning")] | length' "$file" 2>/dev/null || echo "0")
              
              echo "- $(basename $file): $FINDINGS findings ($CRITICAL critical, $HIGH high)"
              TOTAL_FINDINGS=$((TOTAL_FINDINGS + FINDINGS))
              CRITICAL_FINDINGS=$((CRITICAL_FINDINGS + CRITICAL))
              HIGH_FINDINGS=$((HIGH_FINDINGS + HIGH))
            fi
          done
          
          echo ""
          echo "📈 Summary:"
          echo "- Total findings: $TOTAL_FINDINGS"
          echo "- Critical: $CRITICAL_FINDINGS"
          echo "- High: $HIGH_FINDINGS"
          
          # Set output for other jobs/workflows
          echo "total-findings=$TOTAL_FINDINGS" >> $GITHUB_OUTPUT
          echo "critical-findings=$CRITICAL_FINDINGS" >> $GITHUB_OUTPUT
          echo "high-findings=$HIGH_FINDINGS" >> $GITHUB_OUTPUT
          
          # Fail if critical vulnerabilities found
          if [ $CRITICAL_FINDINGS -gt 0 ]; then
            echo "❌ Critical vulnerabilities found! Review required."
            exit 1
          elif [ $HIGH_FINDINGS -gt 0 ]; then
            echo "⚠️  High severity vulnerabilities found. Consider reviewing."
          else
            echo "✅ No critical or high severity vulnerabilities found."
          fi
          
      - name: 'Upload scan artifacts'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-results-${{ github.sha }}
          path: |
            trivy-*-results.sarif
            merged-results.sarif
          retention-days: 30